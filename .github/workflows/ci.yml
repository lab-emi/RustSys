name: ci
on:
  push:
    branches: [main]
  pull_request:

# Line tables instead of full debug information and no incremental caches keep the build
# directory of the test job at about 6 GB instead of 13 GB, within the disk of a hosted runner.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo xtask layout
      - run: cargo xtask shared check
      - run: cargo xtask fixtures
      - run: test -z "$(git status --porcelain -- verification/fixtures)"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --workspace
      - run: cargo xtask verify synth
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
