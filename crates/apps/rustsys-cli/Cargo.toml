[package]
name = "rustsys-cli"
description = "The rustsys command-line program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "rustsys_cli"
path = "src/lib.rs"

[[bin]]
name = "rustsys"
path = "src/main.rs"

[[bench]]
name = "backends"
harness = false

[features]
default = ["cuda"]
# GPU runtime of the mapping backend (SYNTH-REQ-0516).
cuda = ["rustsys/cuda"]

[dependencies]
rusteda-core.workspace = true
rusteda-workspace.workspace = true
rusteda-formats.workspace = true
rustsys.workspace = true
rustsys-check.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rustsys-fixtures.workspace = true
rustsys-defects.workspace = true

[lints]
workspace = true
