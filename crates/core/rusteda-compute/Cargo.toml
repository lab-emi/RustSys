[package]
name = "rusteda-compute"
description = "Compute tasks of the RustEDA tools: timing propagation on the CPU and CUDA backends, GPU backend selection, device self-test and the CUDA device layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors = ["RustEDA contributors"]
repository.workspace = true

[features]
# CUDA backend: CUDA C kernels compiled by NVRTC (COMPUTE-REQ-0002).
cuda = ["dep:cudarc"]

[dependencies]
rusteda-core.workspace = true
bytemuck.workspace = true
rayon.workspace = true
cudarc = { workspace = true, optional = true }

[lints]
workspace = true
