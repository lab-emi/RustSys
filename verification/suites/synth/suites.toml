# RustSys verification suites (SYNTH-REQ-0801, SYNTH-REQ-0802).
# Run all with `cargo xtask verify synth`. Inputs come from `rustsys-fixtures`
# (regenerated into verification/fixtures/synthetic/synth/ by `cargo xtask fixtures`).

[[suite]]
name = "corpus"
test = "crates/apps/rustsys-cli/tests/corpus.rs"
requirements = ["SYNTH-REQ-0801", "SYNTH-REQ-0802", "CHECK-REQ-0040", "CHECK-REQ-0041"]
inputs = "fixtures/synthetic/synth/rtl/index.toml"
libraries = ["wt_rich", "wt_reset_only", "wt_minimal"]
goals = ["delay", "area"]
expect = "equivalent; every retained state bit checked"

[[suite]]
name = "random"
test = "crates/apps/rustsys-cli/tests/random.rs"
requirements = ["SYNTH-REQ-0802"]
generator = "rustsys_fixtures::random::{random_comb, random_seq}"
libraries = ["wt_rich", "wt_reset_only", "wt_minimal"]
expect = "equivalent"

[[suite]]
name = "known-answer"
test = "crates/apps/rustsys-cli/tests/known_answer.rs"
requirements = ["SYNTH-REQ-0802", "SYNTH-REQ-0202", "SYNTH-REQ-0220"]
generator = "rustsys_fixtures::random::random_comb (at most 12 input bits)"
expect = "netlist equals the generator's evaluator on every input vector"

[[suite]]
name = "metamorphic"
test = "crates/apps/rustsys-cli/tests/metamorphic.rs"
requirements = ["SYNTH-REQ-0802"]
checks = ["resynthesis is equivalent", "renaming keeps cell counts", "item reordering keeps the function"]

[[suite]]
name = "defects"
test = "crates/apps/rustsys-cli/tests/defects.rs"
requirements = ["SYNTH-REQ-0802", "CHECK-REQ-0070"]
expect = "every defect class detected; every miss proven functionally benign by an independent evaluator"

[[suite]]
name = "synth-frontend"
test = "crates/apps/rustsys-cli/tests/synth_frontend.rs"
requirements = ["SYNTH-REQ-0102", "SYNTH-REQ-0104", "SYNTH-REQ-0105", "SYNTH-REQ-0120", "SYNTH-REQ-0124", "SYNTH-REQ-0131", "SYNTH-REQ-0141", "SYNTH-REQ-0217", "SYNTH-REQ-0306", "SYNTH-REQ-0307", "SYNTH-REQ-0413", "SYNTH-REQ-0605", "SYNTH-REQ-0702"]
expect = "front-end behavior as specified; functional results proven equivalent by the checker"

[[suite]]
name = "check-obligations"
test = "crates/apps/rustsys-cli/tests/check_obligations.rs"
requirements = ["CHECK-REQ-0040", "CHECK-REQ-0041"]
expect = "every planted difference is reported by the obligation that states it"

[[suite]]
name = "check-seqsim"
test = "crates/apps/rustsys-cli/tests/check_seqsim.rs"
requirements = ["CHECK-REQ-0045"]
expect = "equivalent designs simulate without mismatch; planted defects show in simulation; unsupported designs are skipped with a reason"

[[suite]]
name = "check-netlists"
test = "crates/apps/rustsys-cli/tests/check_netlists.rs"
requirements = ["CHECK-REQ-0020"]
expect = "ANSI and non-ANSI netlists are read alike"

[[suite]]
name = "synth-backends"
test = "crates/apps/rustsys-cli/tests/synth_backends.rs"
requirements = ["SYNTH-REQ-0515", "SYNTH-REQ-0516", "SYNTH-REQ-0517", "SYNTH-REQ-0518"]
libraries = ["wt_rich", "wt_full"]
expect = "the netlist is byte-identical for 1, 3 and 8 threads and for every GPU runtime (GPU part needs a GPU: cargo xtask verify synth --gpu); a missing runtime is an input error"

[[suite]]
name = "netlist-sources"
test = "crates/apps/rustsys-cli/tests/netlist_sources.rs"
requirements = ["SYNTH-REQ-0900", "SYNTH-REQ-0906", "SYNTH-REQ-0910", "CHECK-REQ-0100", "CHECK-REQ-0106", "CLI-REQ-0220", "CLI-REQ-0224"]
libraries = ["wt_rich"]
expect = "hand-written BLIF, AIGER and gate-level sources synthesize and prove equivalent; planted source defects (cover row, latch initial value and clock edge, cell input, AIGER inversion bit, reference cell) are not-equivalent"

[[suite]]
name = "mapping-parallel"
test = "crates/engines/rustsys/src/map/tests.rs"
requirements = ["SYNTH-REQ-0514", "SYNTH-REQ-0515", "SYNTH-REQ-0517"]
generator = "random AIGs (map::tests::random_aig)"
expect = "the parallel required-time sweep, cover extraction and exact-local-area pass equal one-by-one references; mappings equal for 1, 3 and 8 threads"
